name: Website CI
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Audit public routes and assets
        run: npm run routes:check
      - name: Build website
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile, forms and redirects
        run: npm test
